
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b20">
  <title>SOON</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #080b20;
      font-family: Arial, Helvetica, sans-serif;
      isolation: isolate;
    }

    /* Animated background */
    .background {
      position: fixed;
      inset: -50%;
      z-index: -3;
      background:
        radial-gradient(
          ellipse at 20% 30%,
          rgba(27, 83, 190, 0.75),
          transparent 40%
        ),
        radial-gradient(
          ellipse at 80% 65%,
          rgba(100, 43, 190, 0.65),
          transparent 40%
        ),
        radial-gradient(
          ellipse at 50% 50%,
          rgba(0, 190, 255, 0.2),
          transparent 45%
        ),
        #080b20;
      animation: backgroundMove 16s ease-in-out infinite alternate;
    }

    .glow {
      position: fixed;
      width: 65vw;
      height: 65vw;
      max-width: 700px;
      max-height: 700px;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.45;
      z-index: -2;
      pointer-events: none;
    }

    .glow-one {
      background: #176bff;
      top: -25%;
      left: -20%;
      animation: floatOne 13s ease-in-out infinite alternate;
    }

    .glow-two {
      background: #873bff;
      bottom: -30%;
      right: -20%;
      animation: floatTwo 15s ease-in-out infinite alternate;
    }

    .glow-three {
      width: 35vw;
      height: 35vw;
      background: #00c8ff;
      top: 35%;
      left: 35%;
      opacity: 0.18;
      filter: blur(120px);
      animation: pulse 8s ease-in-out infinite;
    }

    /* Subtle moving light streaks */
    .light {
      position: fixed;
      width: 150vw;
      height: 1px;
      left: -25%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(111, 190, 255, 0.45),
        transparent
      );
      opacity: 0;
      transform: rotate(-25deg);
      pointer-events: none;
    }

    .light-one {
      top: 28%;
      animation: lightMove 9s ease-in-out infinite;
    }

    .light-two {
      top: 70%;
      animation: lightMove 12s ease-in-out infinite 4s;
    }

    /* Centered SOON */
    .soon {
      position: relative;
      font-size: clamp(4rem, 14vw, 10rem);
      font-weight: 900;
      letter-spacing: 0.16em;
      padding-left: 0.16em;
      color: #fff;
      text-align: center;
      line-height: 1;
      user-select: none;

      background: linear-gradient(
        110deg,
        #ffffff 10%,
        #bdeaff 35%,
        #ffffff 50%,
        #a8baff 70%,
        #ffffff 90%
      );
      background-size: 250% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;

      filter: drop-shadow(0 0 18px rgba(71, 167, 255, 0.28));
      animation:
        textShine 7s linear infinite,
        textFloat 5s ease-in-out infinite;
    }

    .soon::after {
      content: "";
      position: absolute;
      width: 65%;
      height: 3px;
      bottom: -25px;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 50%;
      background: linear-gradient(
        90deg,
        transparent,
        #45baff,
        #a58bff,
        transparent
      );
      box-shadow:
        0 0 12px rgba(69, 186, 255, 0.7),
        0 0 30px rgba(113, 92, 255, 0.4);
      animation: lineGlow 3s ease-in-out infinite alternate;
    }

    /* Animations */
    @keyframes backgroundMove {
      0% {
        transform: translate(-3%, -2%) rotate(0deg) scale(1);
      }
      100% {
        transform: translate(3%, 2%) rotate(8deg) scale(1.08);
      }
    }

    @keyframes floatOne {
      from {
        transform: translate(0, 0) scale(1);
      }
      to {
        transform: translate(18vw, 15vh) scale(1.2);
      }
    }

    @keyframes floatTwo {
      from {
        transform: translate(0, 0) scale(1);
      }
      to {
        transform: translate(-15vw, -12vh) scale(1.15);
      }
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(0.8);
        opacity: 0.12;
      }
      50% {
        transform: scale(1.2);
        opacity: 0.28;
      }
    }

    @keyframes lightMove {
      0%, 100% {
        opacity: 0;
        transform: translateY(-80px) rotate(-25deg);
      }
      50% {
        opacity: 0.65;
        transform: translateY(80px) rotate(-25deg);
      }
    }

    @keyframes textShine {
      to {
        background-position: 250% center;
      }
    }

    @keyframes textFloat {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-8px);
      }
    }

    @keyframes lineGlow {
      from {
        opacity: 0.55;
        transform: translateX(-50%) scaleX(0.8);
      }
      to {
        opacity: 1;
        transform: translateX(-50%) scaleX(1);
      }
    }

    @media (max-width: 600px) {
      .glow {
        filter: blur(75px);
      }

      .soon {
        letter-spacing: 0.12em;
        padding-left: 0.12em;
      }

      .soon::after {
        bottom: -20px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

<body>
  <div class="background"></div>
  <div class="glow glow-one"></div>
  <div class="glow glow-two"></div>
  <div class="glow glow-three"></div>

  <div class="light light-one"></div>
  <div class="light light-two"></div>

  <main class="soon">SOON</main>
</body>
</html>
