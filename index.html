
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#100c14">
  <title>SOON</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      isolation: isolate;
      background: #100c14;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* الخلفية الكحلي البنفسجي */
    .background {
      position: fixed;
      inset: -30%;
      z-index: -4;
      background:
        radial-gradient(
          ellipse at 18% 25%,
          rgba(91, 45, 94, 0.24),
          transparent 48%
        ),
        radial-gradient(
          ellipse at 85% 75%,
          rgba(133, 65, 105, 0.18),
          transparent 45%
        ),
        radial-gradient(
          ellipse at 50% 50%,
          rgba(57, 37, 74, 0.2),
          transparent 55%
        ),
        #100c14;
      animation: backgroundMove 20s ease-in-out infinite alternate;
    }

    /* توهج متحرك */
    .glow {
      position: fixed;
      z-index: -3;
      width: 60vw;
      height: 60vw;
      max-width: 700px;
      max-height: 700px;
      border-radius: 50%;
      filter: blur(110px);
      pointer-events: none;
      opacity: 0.25;
      will-change: transform;
    }

    .glow-one {
      top: -25%;
      left: -20%;
      background: #b94e91;
      animation: floatOne 16s ease-in-out infinite alternate;
    }

    .glow-two {
      right: -25%;
      bottom: -30%;
      background: #7950a6;
      animation: floatTwo 19s ease-in-out infinite alternate;
    }

    .glow-three {
      width: 35vw;
      height: 35vw;
      top: 30%;
      left: 35%;
      background: #e5b8c9;
      opacity: 0.09;
      filter: blur(100px);
      animation: pulse 9s ease-in-out infinite;
    }

    /* إضاءة ناعمة تمر بالخلفية */
    .light {
      position: fixed;
      z-index: -2;
      left: -50%;
      width: 200%;
      height: 1px;
      pointer-events: none;
      opacity: 0;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(205, 145, 188, 0.25),
        rgba(232, 209, 155, 0.2),
        transparent
      );
      transform: rotate(-28deg);
    }

    .light-one {
      top: 35%;
      animation: lightMove 12s ease-in-out infinite;
    }

    .light-two {
      top: 70%;
      animation: lightMove 15s ease-in-out infinite 5s;
    }

    /* كلمة SOON */
    .soon {
      position: relative;
      z-index: 1;
      padding-left: 0.16em;
      text-align: center;
      user-select: none;
      white-space: nowrap;

      font-size: clamp(4rem, 15vw, 11rem);
      font-weight: 900;
      letter-spacing: 0.16em;
      line-height: 1;

      background: linear-gradient(
        115deg,
        #f3d9a5 0%,
        #e9b8ce 19%,
        #d786bd 35%,
        #a77bc7 51%,
        #e7b3cf 68%,
        #f0d8a7 84%,
        #d786bd 100%
      );

      background-size: 300% 100%;
      background-position: 0% 50%;

      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;

      filter: drop-shadow(0 0 22px rgba(193, 113, 172, 0.12));

      animation:
        gradientFlow 9s ease-in-out infinite,
        textFloat 5s ease-in-out infinite;
    }

    /* خط الإضاءة تحت الكلمة */
    .soon::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -28px;
      width: 65%;
      height: 2px;
      border-radius: 50%;
      transform: translateX(-50%);

      background: linear-gradient(
        90deg,
        transparent,
        #b77cb2,
        #edcfa0,
        #d98fbd,
        transparent
      );

      box-shadow:
        0 0 12px rgba(203, 133, 190, 0.35),
        0 0 28px rgba(174, 109, 174, 0.18);

      animation: lineGlow 4s ease-in-out infinite alternate;
    }

    /* حركة الخلفية */
    @keyframes backgroundMove {
      0% {
        transform: translate(-2%, -1%) rotate(0deg) scale(1);
      }
      100% {
        transform: translate(2%, 2%) rotate(5deg) scale(1.08);
      }
    }

    @keyframes floatOne {
      from {
        transform: translate(0, 0) scale(1);
      }
      to {
        transform: translate(15vw, 12vh) scale(1.15);
      }
    }

    @keyframes floatTwo {
      from {
        transform: translate(0, 0) scale(1);
      }
      to {
        transform: translate(-13vw, -10vh) scale(1.18);
      }
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(0.85);
        opacity: 0.06;
      }
      50% {
        transform: scale(1.15);
        opacity: 0.14;
      }
    }

    @keyframes lightMove {
      0%, 100% {
        opacity: 0;
        transform: translateY(-70px) rotate(-28deg);
      }
      50% {
        opacity: 0.8;
        transform: translateY(70px) rotate(-28deg);
      }
    }

    /* تدرج ألوان الكلمة */
    @keyframes gradientFlow {
      0%, 100% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
    }

    /* حركة هادية للكلمة */
    @keyframes textFloat {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-7px);
      }
    }

    @keyframes lineGlow {
      from {
        opacity: 0.5;
        transform: translateX(-50%) scaleX(0.8);
      }
      to {
        opacity: 1;
        transform: translateX(-50%) scaleX(1);
      }
    }

    /* الموبايل */
    @media (max-width: 600px) {
      .soon {
        font-size: clamp(3.6rem, 15vw, 6rem);
        letter-spacing: 0.12em;
        padding-left: 0.12em;
      }

      .soon::after {
        bottom: -23px;
      }

      .glow {
        filter: blur(75px);
      }
    }

    /* تقليل الحركة عند تفضيل المستخدم */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

<body>
  <div class="background"></div>

  <div class="glow glow-one"></div>
  <div class="glow glow-two"></div>
  <div class="glow glow-three"></div>

  <div class="light light-one"></div>
  <div class="light light-two"></div>

  <main class="soon">SOON</main>
</body>
</html>
